<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Account — NovaStore</title><link rel="stylesheet" href="assets/css/global.css"><script type="module" src="assets/js/shared.js"></script><script type="module" src="assets/js/auth.js"></script></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">N</span> NovaStore</a><div style="flex:1"></div><button class="icon-btn" data-theme-toggle><span data-theme-icon>🌙</span></button></div></header><main class="container" style="max-width:520px;padding-top:42px;padding-bottom:50px"><div class="panel"><div style="text-align:center;margin-bottom:24px"><div class="brand-mark" style="margin:auto;width:54px;height:54px;font-size:23px">N</div><h1 style="margin:15px 0 5px">Welcome back</h1><p class="muted">Sign in or create your NovaStore account.</p></div><form id="authForm" class="form-grid"><div class="field full"><label for="displayName">Display name (for new account)</label><input id="displayName" placeholder="Your name"></div><div class="field full"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field full"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></div><label class="checkbox-line field full"><input type="checkbox" id="createAccount"> Create a new account instead</label><div class="field full"><button class="btn" style="width:100%" type="submit">Continue securely →</button></div></form><button class="btn secondary" style="width:100%;margin-top:10px" id="resetPassword">Forgot password?</button><p class="notice" style="margin-top:18px">Firebase Authentication must be configured before login works. Admin access is
