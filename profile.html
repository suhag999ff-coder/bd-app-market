<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Profile — NovaStore</title><link rel="stylesheet" href="assets/css/global.css"><script type="module" src="assets/js/shared.js"></script><script type="module">import {onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';import{auth,configured}from'./assets/js/firebase.js';const el=document.querySelector('#profileInfo');if(configured)onAuthStateChanged(auth,u=>{el.innerHTML=u?`<h2>${u.displayName||'NovaStore user'}</h2><p>${u.email||''}</p><p class="muted small-text">UID: ${u.uid}</p><button class="btn danger" id="logout">Sign out</button>`:'<h2>Not signed in</h2><p class="muted">Sign in to manage your profile.</p><a class="btn" href="login.html">Sign in</a>';document.querySelector('#logout')?.addEventListener('click',async()=>{await signOut(auth);location.href='index.html'})});</script></head><body class="has-mobile-nav"><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">N</span> NovaStore</a><div style="flex:1"></div><button class="icon-btn" data-theme-toggle><span data-theme-icon>🌙</span></button></div></header><main class="container" style="max-width:720px"><div class="page-title"><h1>Profile</h1><p class="muted">Your account and preferences.</p></div><section class="panel" id="profileInfo"><div class="empty"><div class="big-icon">♙</div><h2>Firebase not configured</h2><p>Add your Firebase settings to load your account.</p><a class="btn" href="login.html">Sign in</a></div></section></main><nav class="mobile-nav"><a href="index.html"><span>⌂</span>Home</a><a href="index.html#all-apps"><span>▦</span>Apps</a><a href="wallet.html"><span>◈</span>Wallet</a><a href="orders.html"><span>▤</span>Orders</a><a class="active" href="profile.html"><span>♙</span>Profile</a></nav><div id="toast" class="toast"></div></body></html>
